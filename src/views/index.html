
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Servidor AWS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101828, #1d4ed8);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 50px 30px;
            max-width: 600px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #dbeafe;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            background: #16a34a;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            color: #bfdbfe;
            font-size: 14px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>🚀 Servidor funcionando com CD na branch MAIN!</h1>

    <p>
        Minha aplicação está hospedada na AWS EC2
        e utilizando o Nginx como proxy reverso.
    </p>

    <div class="status">
        ● Sistema Online
    </div>

    <footer>
        Projeto acadêmico - DevOps
        <br>
        Hospedado na Amazon Web Services
    </footer>
</div>
</body>
</html>
