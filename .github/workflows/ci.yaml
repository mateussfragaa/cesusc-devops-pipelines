
name: CI

on:
  push:
    branches: ["develop", "main"]

  pull_request:
    branches: ["develop", "main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install curl -y
          curl -L "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_148.0.7778.167-1_amd64.deb" -o /tmp/google-chrome-stable_current_amd64.deb
          sudo DEBIAN_FRONTEND=noninteractive apt install /tmp/google-chrome-stable_current_amd64.deb -y --allow-downgrades

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest
        run: npm test -- --runInBand
