
name: CI

on:
  push:
    branches: ["develop"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          sudo apt update && sudo apt install curl -y
          sudo DEBIAN_FRONTEND=noninteractive \
          apt install google-chrome -y --allow-downgrades

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest
        run: npm test -- --runInBand
